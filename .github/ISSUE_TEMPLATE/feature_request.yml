name: 需求 / 功能建议
description: 想做的新功能、新板子、新算法
title: "[Feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: 想达成什么
      description: 描述目标，不要直接描述实现方式
      placeholder: 希望头部快速转动时，猫耳跟随的滞后控制在 50ms 以内
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 为什么需要
      description: 场景、收益、不做的代价
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: 可能的方案
      description: 有想法就写，没有就留空。涉及选型的，后续要落 ADR
      placeholder: |
        1. 提高采样率到 200Hz，缩短控制周期
        2. 换 Mahony 滤波，代价是算力
    validations:
      required: false
  - type: textarea
    id: metrics
    attributes:
      label: 验收标准
      description: 量化指标，便于判断做完没有
      placeholder: 阶跃响应上升时间 ≤ 50ms，超调 ≤ 10%
    validations:
      required: false
  - type: dropdown
    id: group
    attributes:
      label: 所属方向
      options:
        - 电控
        - 算法
        - 两者协同
    validations:
      required: true
