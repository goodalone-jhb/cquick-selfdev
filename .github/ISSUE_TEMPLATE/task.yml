name: 任务
description: 拆解出来的可执行事项，用于排期与跟踪
title: "[Task] "
labels: ["task"]
body:
  - type: textarea
    id: what
    attributes:
      label: 要做的事
      description: 一句话说明交付物
      placeholder: 完成主控板 v1.2 的电源部分焊接与上电测试
    validations:
      required: true
  - type: textarea
    id: checklist
    attributes:
      label: 拆解
      description: 拆到每项半天到一天能完成
      value: |
        - [ ] 
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: input
    id: deadline
    attributes:
      label: 期望完成时间
      placeholder: 2026-12-05
    validations:
      required: false
  - type: dropdown
    id: group
    attributes:
      label: 所属方向
      options:
        - 电控
        - 算法
        - 文档
        - 其他
    validations:
      required: true
  - type: textarea
    id: deps
    attributes:
      label: 依赖与风险
      description: 卡在什么上、需要谁配合
    validations:
      required: false
